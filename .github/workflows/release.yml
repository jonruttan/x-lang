name: Release

# Tier-1 pin artifacts (#115; docs/modules.md "Pinning"): a version tag
# publishes the amalgamated boot entries -- each dialect's full boot as
# ONE self-contained, zero-path-literal file -- plus SHASUMS (coreutils
# format) and pin.release.xon (xon: the per-file sha256 digests, the
# ISA fingerprint -- the digest of engine/tools/contract/isa.x, the ratcheted C-surface
# manifest these amalgams were built against; make check-isa holds
# manifest == binary, so the fingerprint names the engine contract -- and
# the PAYLOAD fingerprint, one digest over everything the release ships as
# library).  The two are not redundant: the C surface is fixed by design
# and is identical across releases, so it can pair an amalgam with an
# engine but can never say WHICH release either came from (#435).  The
# binaries job stamps that same payload digest and the tag into every
# tarball's install tree, and package.sh fails the job if its stamp
# disagrees with the repo this manifest was computed from -- which is what
# keeps the two jobs' artifacts describing one release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # the gate reads ci.yml's verdict for the tagged commit
  actions: read

jobs:
  artifacts:
    name: publish amalgams + manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Acquire the engine
        run: make engine
      - name: Build
        run: make
      # THE GATE STANDS BETWEEN A TAG AND ITS ARTIFACTS: a tag on a red
      # tree publishes nothing.  But a tag lands on a commit ci.yml has
      # ALREADY judged -- every push to main runs the full contract gates,
      # both spec suites, conformance, doctests, examples, lint and docs,
      # on both platforms -- and re-running the same half hour here on the
      # same bytes bought nothing but a second chance to fail.  It took
      # that chance: the v0.11.0 tag died twice in this step, on a lint
      # width ci.yml had already pinned, and every retry cost forty
      # minutes.  So the gate ASKS for that verdict first and runs the
      # suite itself only when there is none -- a tag on a commit CI never
      # saw still pays in full.  The one target ci.yml cannot run is run
      # here regardless: check-release-version fires only AT a tag.
      # When the suite does run here, test-x writes its state images
      # uncached, about two minutes: a release run is rare and a second
      # copy of ci.yml's cache key is a fact nobody would keep in step.
      - name: Gate
        env:
          GH_TOKEN: ${{ github.token }}
          # For the fallback, when the suite does run here.  SPEC_HEAVY_JOBS
          # (2026-08-20): at the heavy-spec window the 16GB ubuntu runner
          # cannot hold two ~5-9GB x-bin heaps -- the v0.5.0 run died there
          # (test-x, `recursion`, exit 143); one heavy spec in flight bounds
          # it at one heap.  NPROC: the same lesson one target later.  A
          # lint child peaks past 2GB now that a batch lints eight files in
          # one boot (#323), and four of them killed this runner twice
          # (v0.11.0, SIGTERM 143, the same file both times).  Two is the
          # width ci.yml has run green since its own pin.
          PARALLEL: "1"
          SPEC_HEAVY_JOBS: "1"
          NPROC: "2"
        run: |
          set -e
          make check-release-version
          # ci.yml's run for THIS sha -- the push to main the tag sits on.
          # Still in flight: wait for it rather than duplicate it.
          runs() {
            gh run list --workflow=ci.yml --event push --commit "$GITHUB_SHA" \
              --json status,conclusion --jq "$1"
          }
          waited=0
          while [ "$(runs '[.[] | select(.status != "completed")] | length')" != "0" ] \
                && [ "$waited" -lt 2400 ]; do
            echo "gate: ci.yml is still judging $GITHUB_SHA -- waiting (${waited}s)"
            sleep 60; waited=$((waited + 60))
          done
          # ANY green run for the sha counts: a cancelled or superseded run
          # beside a passing one is still a judged commit.
          verdict=$(runs '[.[] | select(.status == "completed") | .conclusion]
                          | if index("success") then "success" else (.[0] // "none") end')
          if [ "$verdict" = "success" ]; then
            echo "gate: ci.yml already passed $GITHUB_SHA -- not running the suite twice"
          else
            echo "gate: no green ci.yml run for $GITHUB_SHA (got '$verdict') -- running the full gate here"
            make test
          fi
      - name: Amalgams + manifest
        run: |
          make boot
          sh tools/release/release-manifest.sh "$GITHUB_REF_NAME"
      # Dogfood cross-check: the pure-x Sha256 (x/codec/sha256 -- the
      # consumer-side verify anchor) must agree with coreutils on the ISA
      # fingerprint consumers will check against.  isa.x is ~10KB (~15s
      # pure-x); the amalgams would cost minutes each for no extra proof.
      # The script is a TREE file, not an inline heredoc: the v0.4.0 tag
      # failed here on a retired API the gates never saw, because a
      # workflow that only runs on tags is invisible to them (#180 family).
      - name: Cross-check pure-x sha256 against the manifest
        run: |
          got=$(sh x.sh --no-pin -f tools/release/hash-isa.x | tail -1)
          want=$(grep '^(isa ' build/release/pin.release.xon | sed 's/.*sha256:\([0-9a-f]*\).*/\1/')
          echo "pure-x:   $got"
          echo "manifest: $want"
          [ -n "$want" ] && [ "$got" = "$want" ] \
            || { echo "pure-x sha256 disagrees with the manifest" >&2; exit 1; }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # A hyphenated tag (v0.4.0-rc1) is a prerelease by convention --
        # it must not surface as the repo's "Latest release".
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE=--prerelease ;;
            *)   PRERELEASE= ;;
          esac
          notes="$(cat <<'NOTES'
          ## Prebuilt binaries (no toolchain, no compile)

          Download the tarball for your platform, verify, extract, and run:

          ```sh
          tar -xzf x-<tag>-<os>-<arch>.tar.gz
          # macOS: a downloaded binary is Gatekeeper-quarantined until you clear it
          xattr -dr com.apple.quarantine x-<tag>            # macOS only
          x-<tag>/bin/x                                     # REPL
          ```

          Each tarball is the full install tree (wrapper + engine + library),
          relocatable -- run it wherever you unpack it, or add `x-<tag>/bin`
          to PATH. Verify with the sidecar: `sha256sum -c x-<tag>-<os>-<arch>.tar.gz.sha256`.
          On macOS the engine is signed with a Developer ID and notarized,
          so Gatekeeper accepts it once the quarantine attribute is cleared.
          (Builds made without the signing secrets -- a fork, or a tag pushed
          where they are unset -- ship ad-hoc signed instead.) Check whichever
          you have: `spctl -a -vv -t install <tree>/libexec/x/x-bin` reports
          `source=Notarized Developer ID` for a notarized engine.

          ## Amalgams (tier-1 platform pins)

          The `*.x` files are the amalgamated boot entries -- each dialect's
          full boot as one self-contained, zero-path-literal file. `SHASUMS`
          covers them (`sha256sum -c SHASUMS`); `pin.release.xon` is the
          machine-readable manifest (xon), including the ISA fingerprint
          (sha256 of engine/tools/contract/isa.x -- the C-surface contract every artifact in
          this release was built against) and the payload fingerprint (one
          digest over everything this release ships as library). A pinned
          project records this tag alongside them, and the wrapper refuses
          to boot an amalgam from one release on another release's engine.
          NOTES
          )"
          gh release create "$GITHUB_REF_NAME" $PRERELEASE \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            build/boot/*.x build/release/SHASUMS build/release/pin.release.xon

  # Per-platform binary tarballs (#115 follow-up: the no-toolchain half of
  # "start without compiling x").  Needs the release to exist; each matrix
  # leg builds, packages the relocatable install tree, and uploads its own
  # tarball + sha256 sidecar.  tools/release/package.sh self-proves relocation
  # (unpack elsewhere, run) before the upload, so a broken package fails
  # the job instead of shipping.
  binaries:
    name: binary tarball (${{ matrix.os }})
    needs: artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - name: Acquire the engine
        run: make engine
      # macOS notarization (opt-in via secrets): import the Developer ID
      # cert into a throwaway keychain and stage the App Store Connect API
      # key.  ALL secret-gated -- if MACOS_CERT_P12 is empty (no secrets,
      # or a fork) every step below no-ops and the tarball ships ad-hoc
      # signed exactly as before.  Set MACOS_SIGN_IDENTITY only on success,
      # so package.sh notarizes only when the cert really imported.
      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "no MACOS_CERT_P12 secret -- shipping ad-hoc signed (not notarized)"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(uuidgen)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # Put the temp keychain on the search list so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/["[:space:]]//g')
          rm -f "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | sed 's/.*"\(.*\)"/\1/')
          [ -n "$identity" ] || { echo "no Developer ID Application identity in the cert" >&2; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Stage notary API key (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY != ''
        env:
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
        run: |
          printf '%s' "$MACOS_NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "MACOS_NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Build + package
        env:
          # Empty on Linux and on an unsigned macOS run -> package.sh skips
          # notarization; set -> package.sh signs + notarizes before tarring.
          MACOS_SIGN_IDENTITY: ${{ env.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_PATH: ${{ env.MACOS_NOTARY_KEY_PATH }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: sh tools/release/package.sh "$GITHUB_REF_NAME" build/dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            build/dist/*.tar.gz build/dist/*.tar.gz.sha256 --clobber
      # Always tear down the signing material, success or fail.
      - name: Clean up signing material (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12" 2>/dev/null || true
