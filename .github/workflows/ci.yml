name: CI

# ONE VERDICT PER TREE.  A pull request runs everything that judges a
# commit: every gate, both spec suites, doctests, lint, docs, man pages and
# the examples.  It records the tree it tested (the `tree` job).  A push to
# main whose tree a passing PR run already tested is not run again: the
# `reuse` job finds that run and every other job skips, so the release gate
# reads the PR's verdict.  A merge whose tree no PR run tested (main moved
# after the PR's last run, a squash, a direct push) runs in full.
# AddressSanitizer is .github/workflows/asan.yml, on main only.
#
# FAN-OUT (2026-08-18, #318).  The suite used to run as ONE job whose
# steps ran serially, so the wall clock was the SUM of every step
# (~23 min on main).  The steps are independent given a built x-bin and
# the build is ~3s, so they now run as parallel jobs and the wall clock
# is the slowest LEG.  Resource discipline, so the fan-out cannot crash
# a runner: every job is its own runner VM, and no in-job parallelism
# knob changed -- lint keeps its min(cores,4) fan-out (a child peaks
# ~600MB; 8-wide once OOM-killed a runner) and the spec runner keeps its
# PARALLEL_JOBS derivation.  Each memory ceiling now has a whole VM to
# itself instead of sharing one with its neighbours.  A main push spawns
# 5 macOS jobs -- exactly the free-plan macOS concurrency cap -- so a
# second active run queues rather than failing; that is the graceful
# direction.  check-bootstrap builds in a staged tracked-files copy
# (#326), so it no longer wipes the workspace's artifacts and the gates
# job is safe to split further if a future re-balance wants it.

on:
  push:
    branches: [main]
  pull_request:
  # A manual run on any ref runs in full.
  workflow_dispatch:

# A superseded PR run keeps burning runners until its slowest leg ends;
# cancel it when a newer push to the same ref arrives.  Main runs are
# never cancelled: every merge gets its full verdict read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The tree a PR run tests: the merge of the PR into main as it stood.
  tree:
    name: tested tree
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: git rev-parse 'HEAD^{tree}' > tree
      - uses: actions/upload-artifact@v7
        with:
          name: tested-tree
          path: tree
          retention-days: 30

  # On a push to main: a merge commit whose second parent is a PR head, and
  # whose tree a passing PR run of that head recorded, has its verdict.
  reuse:
    name: reuse a PR's verdict
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.find.outputs.tested }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          head=$(git rev-parse -q --verify 'HEAD^2' || true)
          tested=false
          if [ -n "$head" ]; then
            for id in $(gh run list --workflow ci.yml --event pull_request --commit "$head" \
                          --status success --json databaseId --jq '.[].databaseId'); do
              dir=$(mktemp -d)
              if gh run download "$id" --name tested-tree --dir "$dir" 2>/dev/null &&
                 [ "$(cat "$dir/tree")" = "$tree" ]; then
                echo "PR run $id passed on tree $tree: not running it again"
                tested=true
                break
              fi
            done
          fi
          [ "$tested" = true ] || echo "no passing PR run tested tree $tree: running in full"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  # The 32-bit arm leg: the suite inside a linux/arm/v7 container on the
  # arm64 runner, whose kernel executes it natively (CONFIG_COMPAT; QEMU is
  # not installed, since a registered qemu-arm would take the binaries over).
  # It gates: a 32-bit regression fails the run, so a PR goes red and the
  # reuse job finds no passing run to carry onto main.  The stress lane
  # stays off: its heaps are sized for a 64-bit address space.
  specs-arm:
    name: specs (linux/arm/v7)
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build and test in a 32-bit container
        run: |
          docker run --rm --platform linux/arm/v7 -v "$PWD:/w" -w /w \
            -e PARALLEL=1 -e SPEC_HEAVY_JOBS=1 debian:bookworm sh -c '
            apt-get update -q > /dev/null
            apt-get install -y -q --no-install-recommends \
              build-essential git curl ca-certificates cmake sudo netcat-openbsd > /dev/null
            getconf LONG_BIT && uname -m
            sh tools/dev/sdl3-install.sh || echo "sdl3-install failed; the x/sys/sdl spec will say so"
            # the suite as the checkout'"'"'s owner, as the other legs run it:
            # specs compare the files'"'"' owner with the effective uid
            useradd -m -u "$(stat -c %u /w)" builder
            su builder -c "make engine && make && make test-c && make test-x \
              && make conformance && make doctest"'

  specs:
    name: specs (${{ matrix.os }})
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.tested != 'true' }}
    runs-on: ${{ matrix.os }}
    # The macOS job grew from 8 to 19 minutes across eight runs of main and
    # PR #665's first attempt was cancelled at 20 with every suite green,
    # fifteen seconds into doc-examples: the cap sits inside the job's normal
    # spread now, so a slow runner reads as a failure.
    timeout-minutes: 30
    # The arm64 Linux leg reports and does not gate: a failure there leaves
    # the run's verdict, which the release gate reads, to the other two.
    # The engine pin declares no linux arm64 artifact, so that leg's
    # `make engine` clones the pinned release and builds it.
    continue-on-error: ${{ matrix.os == 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      # x-lang is the language; the engine is a separate project, acquired
      # rather than carried.  This is the step the submodule used to hide.
      - name: Acquire the engine
        run: make engine
      - name: Build
        run: make
      - name: C specs
        run: make test-c
      # x/sys/sdl's spec loads the host's libSDL3; Linux builds it from the
      # tag in the script, cached on the script and the runner.
      - name: SDL3 build cache
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.sdl3
          key: sdl3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/dev/sdl3-install.sh') }}
      - name: SDL3
        run: sh tools/dev/sdl3-install.sh
      # THE STATE IMAGES THE SUITE BOOTS FROM, cached across runs.  Writing
      # all 29 costs about three minutes (2026-09-06, the three JIT dialects
      # among them), more than images save a run, so a miss pays once and a
      # hit boots for free.  The key names the inputs
      # tools/dev/image-build.sh hashes -- the pin stands in for the engine
      # binary, which does not exist until `make engine` has run -- and the
      # builder re-checks its own key on load, so a stale hit only costs a
      # rewrite, never a stale library.  After the engine step on purpose:
      # the contract files under engine/ are part of the hash.  The
      # architecture is in the key because an image is one machine's heap:
      # the two Linux legs share an OS name and nothing else.
      - name: State images
        uses: actions/cache@v6
        with:
          path: .images
          key: images-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/engine/engine.pin.xon', 'lib/**/*.x', 'tests/x/lib/*.x', 'engine/tools/contract/*.x', 'tools/dev/image-build.sh', 'tools/dev/image-write.x', 'tools/dev/image-read.x', 'lib/img.x') }}
      - name: x-lang specs
        run: make test-x
        env:
          PARALLEL: "1"
          # ONE heavy spec in flight, not two (2026-08-20, measured with a
          # temporary in-step memory sampler). At the heaviest window the
          # 16GB ubuntu runner held TWO ~5-9GB x-bin heaps at
          # once: main peaked at 6.6GB + 5.3GB (12.7GB total -- 80% of the
          # VM, passing on the grace that one finishes early), and the
          # object-model v2 branch's linux peaks grew to 7.7GB + 7.7GB --
          # runner OOM-killed, "runner received a shutdown signal", exit
          # 143, with no job surviving to name a file. One heavy plus
          # light fill bounds the window at ONE big heap (~9GB worst
          # measured). The macOS leg keeps the default: its peaks are
          # smaller and it has passed at width 2 throughout.
          SPEC_HEAVY_JOBS: ${{ runner.os == 'Linux' && '1' || '2' }}
          # The applicative stress lane (#300): serial tail, ~4.7GB peak
          # per file -- inside the heavy-spec envelope on these runners.
          # NEVER set STRESS on the asan job: the sanitizer multiplies
          # those peaks 2-4x past any runner (the #366 OOM shape).
          STRESS: "1"
      # The conformance suite was reachable only through `make test`, which no
      # job here runs -- the #330 lesson again, in a new coat: its posix half
      # had NEVER executed on Linux until the v0.5.0 release run, where the
      # doubles test failed on the first try (sqrt lives in libm on Linux, and
      # the engine deliberately links no libm; the spec assumed a self-handle
      # finds it, which is true only where libc bundles the math functions).
      # A suite that exists to prove an engine on every platform has to RUN on
      # every platform this file covers.
      - name: Conformance
        run: make conformance
      # Doctest ratchet (#16): every (example ...) in the doc registry is an
      # executable contract; a stale example is a red build, not quiet rot.
      - name: Doctests
        run: make doctest
      # spec.md's worked examples (#70 seam 2), same extract-and-execute
      # shape.  In `make test` and the release gate since promotion day but
      # absent here until #330 -- so a drifting example surfaced at RELEASE
      # time instead of on the PR that drifted it.
      - name: Spec examples
        run: make spec-examples
      # The same extraction pointed at the other docs that write examples in
      # the `EXPR -> EXPECTED` form.  Both are GATED since #452/#453 fixed
      # them: primitives.md and standard-library.md were promoted out of
      # report-only once green, which is the criterion doc-examples.conf
      # states.  The report tier stays in the driver for the next doc to
      # enter through.  Note the lesson from #330 directly above: a target
      # reachable only through `make test` is invisible here, because this
      # workflow enumerates targets.
      - name: Doc examples
        run: make doc-examples
      # Tool-suite specs (promoted with the #180 repair; joined only once
      # fully green).  Builds the coverage binary for the cov half; since
      # #329 every variant compiles to its own object suffix, so this no
      # longer disturbs the plain build's objects and its position in the
      # job is a free choice.
      - name: Tool specs
        run: make test-tools

  gates:
    name: gates (${{ matrix.os }})
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.tested != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      # THE SANITIZER ENGINE IS BUILT FROM THE PINNED SOURCES, and a tag is
      # immutable (asan-boot.sh: "the build never goes stale"), so the build
      # -- 55 seconds on both runners, before a single dialect boots -- is
      # the same bytes on every run of the same pin on the same image.
      # Cached on exactly those two facts.  The IMAGE is in the key on
      # purpose: the engine is built with gcc, which links libasan
      # DYNAMICALLY, so a binary is only as good as its image's runtime, and
      # a new image is a new build.  A miss costs what every run cost
      # before; the sources come back with the build, so fetch.sh's source
      # arm reuses the tree instead of cloning.
      - name: Runner image
        id: image
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Sanitizer engine build
        uses: actions/cache@v6
        with:
          path: deps/engine-src
          key: asan-engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/engine/engine.pin.xon') }}-${{ steps.image.outputs.version }}
      # x-lang is the language; the engine is a separate project, acquired
      # rather than carried.  This is the step the submodule used to hide.
      - name: Acquire the engine
        run: make engine
      - name: Build
        run: make
      # The full contract gates on every run, a PR's included: a gate that
      # runs only after merge lets main go red on a change its PR passed.
      # The job (about 12 minutes) runs beside the specs legs and finishes
      # before them.
      - name: Contract gates
        run: make gates

  lint:
    name: lint (${{ matrix.os }})
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.tested != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      # x-lang is the language; the engine is a separate project, acquired
      # rather than carried.  This is the step the submodule used to hide.
      - name: Acquire the engine
        run: make engine
      - name: Build
        run: make
      # x-lang lint (promoted 2026-08-02, #60 criterion: joined only once
      # fully green): lib + apps sweep, sibling-preload aware since #176.
      #
      # NPROC PINNED ON UBUNTU, for the reason SPEC_HEAVY_JOBS is pinned
      # above: the 7GB linux runner is the box that OOMs, and lint's
      # children are ~600MB each (class.x, measured -- tools/dev/lint.sh
      # carries the figure).  Two main runs died here with no job
      # surviving to name a file -- SIGTERM 143, "runner received a
      # shutdown signal", the signature this file already documents for
      # an OOM-killed runner -- while the 14GB macOS leg passed both.
      #
      # The pin is worth having even where it changes nothing today.
      # lint.sh derives min(cores, 4), so the width is whatever the
      # RUNNER happens to have: a hosted-runner spec bump would silently
      # widen the sweep and buy back the failure, which is the drift this
      # makes impossible to reintroduce by accident.  macOS is left
      # unset deliberately -- it keeps lint.sh's default, and naming a
      # number there would RAISE its width rather than cap it.
      - name: x-lang lint
        env:
          NPROC: ${{ matrix.os == 'ubuntu-24.04' && '2' || '' }}
        run: make lint-x

  docs:
    name: docs (${{ matrix.os }})
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.tested != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      # x-lang is the language; the engine is a separate project, acquired
      # rather than carried.  This is the step the submodule used to hide.
      - name: Acquire the engine
        run: make engine
      - name: Build
        run: make
      # Doc generation (#308): the gate had no target that parses library
      # SOURCE, so a tree whose reader the doc tool chokes on was green --
      # #306 broke doc.x and fmt.x on every file it touched and make test
      # still passed.  doc-x sweeps lib/x/**, fails the file on a non-zero
      # exit, and fails an EMPTY page for a file that declares (doc (provide,
      # so it catches a reader that silently drops forms as well as one that
      # dies.  Output lands in docs/ref/x/, which is gitignored.
      - name: Doc generation
        run: make doc-x

  # The man-page path had NO gate target at all.  doc-man sits outside `doc`
  # deliberately -- it is a second full library sweep and only install-man
  # consumes it -- so nothing in CI ever ran either it or the install, and
  # both reached main unexercised.  Structural checks only (see the script
  # header): the gate does not turn on which roff toolchain a runner ships.
  #
  # BOTH tiers, not deep-only.  The surfaces this covers are generated
  # artifacts and shell plumbing, which is exactly the kind of thing a PR
  # breaks and a deep-tier-only gate reports a merge too late.  It is cheap
  # next to the legs beside it: one library sweep and a copy into a temp
  # prefix.
  #
  # Doxygen is Linux-only here.  The C half needs it, apt has it in seconds,
  # and brew would spend minutes building it on the macOS leg for a page set
  # that is identical on both.  CHECK_MAN_C is what the script keys on, and
  # it says out loud when the half is not checked.
  man:
    name: man pages (${{ matrix.os }})
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.tested != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      # SOURCES.  Half of what this job checks is the engine's C reference --
      # Doxygen over its sources, asserted on Linux by CHECK_MAN_C -- so a
      # released engine, which ships no C, would leave install-man-c with
      # nothing to install and the smoke would rightly fail.  The job that
      # checks the C reference needs the C, the same as the Pages build.
      - name: Acquire the engine (sources)
        run: make engine-source
      - name: Build
        run: make
      - name: Install Doxygen (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q doxygen
      - name: Man generation + install smoke
        run: make check-man
        env:
          CHECK_MAN_C: ${{ runner.os == 'Linux' && '1' || '' }}

  # Deep tier only: the examples ratchet.  This job was `interactive` and ran
  # the Logo pty contract beside it -- paired so the ubuntu expect install was
  # paid once.  That contract went with the lang (x-logo runs it on both OSes,
  # against a matrix of releases, which is more than this ever did), so what is
  # left is the examples and the job is named for them.  It keeps the OS matrix:
  # examples/rn/ reaches raw syscalls, and their numbers differ per platform.
  examples:
    name: examples (${{ matrix.os }})
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.tested != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      # x-lang is the language; the engine is a separate project, acquired
      # rather than carried.  This is the step the submodule used to hide.
      - name: Acquire the engine
        run: make engine
      - name: Build
        run: make
      # Examples ratchet: every file under examples/ runs under its documented
      # dialect (batch mode), output-pinned where portable.  The first code a
      # newcomer runs was previously the only code with no gate -- and its
      # first-ever run caught or/cat.x broken by the #36 opt-in re-cut.
      - name: Examples
        # EXAMPLE_JOBS PINNED ON UBUNTU, for the reason SPEC_HEAVY_JOBS is:
        # examples.sh runs four at once, and glob order makes its first batch
        # three radon boots plus x/factorial.x.  Measured on x86-64 (the qemu
        # box, tools/dev/x86-vm.sh): a tower boot peaks at ~3.4GB there and the
        # factorial example at 7.1GB, so that batch is ~17GB at once on the
        # linux runner.  It dies at that peak, ~30s in -- SIGTERM 143, no
        # example finished, so nothing named -- the signature this file already
        # documents for an OOM-killed runner.  Red on most main runs since #595
        # made every tower boot heavier (2026-09-02); the macOS leg, with the
        # smaller arm64 peaks, passed throughout at width 4 and keeps it.
        env:
          EXAMPLE_JOBS: ${{ matrix.os == 'ubuntu-24.04' && '1' || '4' }}
        run: make check-examples
