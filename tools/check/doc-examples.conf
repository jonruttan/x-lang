# doc-examples.conf -- which prose docs have their worked examples executed.
#
# Columns:  <doc>  <heading-level>  <lib>  <mode>
#
#   heading-level  markdown level whose headings open a spec group (2 = `## `).
#                  primitives.md needs 3: its `##` headings are the three
#                  PARTS it is filed into (#486), so grouping at level 2 would
#                  emit three enormous files and re-create the batching failure
#                  the per-section split exists to prevent.
#   lib            `# @lib` dialect for the generated files; `-` means the
#                  runner default (lib/x-core.x).
#   mode           gate   = failures fail the build.
#                  report = failures are PRINTED and counted, build stays green.
#
# Promotion is deliberate and follows the precedent spec-examples itself set:
# it began report-only at 86 failures and joined `test` only once fully green,
# on the stated criterion that a red gate rots the way lint-x (#60) did.
# A doc moves report -> gate by fixing the doc, not by relaxing the check.
#
# docs/spec.md is NOT listed here: it has its own `make spec-examples` target,
# and a gate output contract that predates this driver.  Nothing is gained by
# moving it and a live ratchet is put at risk.

docs/primitives.md         3   -     gate     # green since #452
docs/standard-library.md   2   x.x   gate     # green since #453
docs/tutorial.md           2   xe.x  gate     # session transcripts (```x-repl, `> EXPR`)
docs/sandboxing-tutorial.md 1  x.x   gate     # one session: later sections use the earlier ones' defs
#
# Not listed: docs/modules.md, docs/pinning-tutorial.md and
# docs/lang-contract.md.  Their transcripts are Pin walkthroughs that fetch,
# write deps/ and print `("x/type/dict.x" ...)` placeholders -- illustration,
# not assertion.
